name: Kiểm tra hệ thống Agent

# Vì sao cần CI cho một dự án Zero-CLI:
# người dùng là QA/BA/PO, họ KHÔNG BAO GIỜ gõ `npm run agent:check` hay `npm test`.
# Nếu không có thứ gì tự chạy những lệnh đó, hệ thống sẽ âm thầm vỡ mà chỉ phát
# hiện ra lúc đang dạy hoặc lúc học viên làm bài.

on:
  push:
    branches: [main, develop, exam, 'sample/**']
  pull_request:
  workflow_dispatch:

jobs:
  kiem-tra:
    name: Toàn vẹn · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cài thư viện
        run: npm ci

      # Chạy TRƯỚC khi cài gì thêm: bắt lỗi kiểu "đường dẫn template sai" mà chỉ
      # lộ ra trên dự án trắng. --dry-run nên không ghi gì vào repo.
      - name: Khởi tạo khung (dry-run)
        run: npm run init -- --dry-run --no-install

      - name: Test tool nội bộ
        run: npm test

      # Đối soát chéo agent · skill · bản đồ · WORKFLOW · package · cổng ASK.
      # Đây là cổng quan trọng nhất: nó bắt được việc sửa một file rồi quên khai báo.
      - name: Toàn vẹn hệ thống agent
        run: npm run agent:check

      - name: Chuẩn FACT của deliverable
        run: npm run lint

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Chỉ nhánh nào có bộ nối SUT mới chạy được. develop là nhánh khung,
    # không gắn hệ thống nào nên không có test để chạy.
    if: github.ref_name != 'develop' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Tải trình duyệt
        run: npx playwright install --with-deps chromium

      - name: Chạy E2E
        run: npm run test:e2e
        env:
          QA_TASK_SLUG: ci
          QA_RUN_ID: RUN-${{ github.run_number }}

      # Ảnh bằng chứng nằm ở OUTPUT/ci/runs/<id>/evidence/ theo AGENTS.md §1.2.
      - name: Lưu bằng chứng khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_number }}
          path: OUTPUT/ci/runs/
          retention-days: 7
